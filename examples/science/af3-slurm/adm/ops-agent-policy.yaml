osPolicies:
- id: ops-agent-setup
  mode: ENFORCEMENT
  resourceGroups:
  - resources:
    - id: install-configure-and-patch
      exec:
        validate:
          interpreter: SHELL
          script: |
            #!/bin/bash
            # 1. Check if the Ops Agent is running
            systemctl is-active --quiet google-cloud-ops-agent || exit 101

            # 2. Check if the custom Slurm logging configuration exists
            grep -q "slurm_logs" /etc/google-cloud-ops-agent/config.yaml || exit 101

            # 3. Check if kernel/kmod exclusions are in place to fix OS Config errors
            grep -q "exclude=kernel\* kmod-\*" /etc/dnf/dnf.conf || exit 101

            # If all checks pass, the node is fully compliant
            exit 100
        enforce:
          interpreter: SHELL
          script: |
            #!/bin/bash
            echo "Starting background Ops Agent installation, configuration, and YUM patching..."

            # 1. Fix YUM/DNF dependency errors & protect GPUs by excluding kernels
            if ! grep -q "exclude=kernel\* kmod-\*" /etc/dnf/dnf.conf; then
                echo "exclude=kernel* kmod-*" >> /etc/dnf/dnf.conf
            fi

            # 2. Repair the RPM database
            rm -f /var/lib/rpm/__db*
            rpm --rebuilddb

            # 3. Remove legacy agents
            yum remove -y stackdriver-agent google-fluentd catchpoint-fluentd google-cloud-monitoring || true

            # 4. Install the Ops Agent
            curl -sSO https://dl.google.com/cloudagents/add-google-cloud-ops-agent-repo.sh
            bash add-google-cloud-ops-agent-repo.sh --also-install

            # 5. Inject the Custom Logging Configuration
            cat << 'EOF' > /etc/google-cloud-ops-agent/config.yaml
            logging:
              receivers:
                slurm_logs:
                  type: files
                  include_paths:
                    - /var/log/slurm/slurmd-*.log
                    - /var/log/slurm/setup.log
                    - /var/log/slurm/slurmsync.log
              service:
                pipelines:
                  slurm_pipeline:
                    receivers: [slurm_logs]
            EOF

            # 6. Restart to apply the new configuration
            systemctl restart google-cloud-ops-agent

            exit 100
instanceFilter:
  inclusionLabels:
  - labels:
      slurm_instance_role: compute
rollout:
  disruptionBudget:
    fixed: 10
  minWaitDuration: 0s
